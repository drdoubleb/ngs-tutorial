/* ---------------- 12 · Alignment ---------------- */
{
  label:"Alignment",grp:"Alignment",dot:"B2",
  eyebrow:"Bioinformatics · Alignment",
  title:"Find where the read belongs",
  lede:"The human reference is 3 billion letters and every read must find its home. Aligners score each candidate position — +1 for a match, −1 for a mismatch — and keep the best. Here you do it by hand: <b>slide the read</b> along the reference and watch the score.",
  build(stage){
    const read1=((RUN.read&&RUN.read.length===8)?RUN.read:"ACGTGCAT").split("");
    const L=20,TARGET=9,PITCH=29;
    // build a reference with read 1's true site at TARGET and a near-miss decoy
    const AB=["A","C","G","T"];
    const ref=[];for(let i=0;i<L;i++)ref.push(AB[(i*7+3)%4]);
    const dec=read1.slice();dec[2]=COMP[dec[2]];dec[5]=COMP[dec[5]];
    for(let i=0;i<8;i++)ref[1+i]=dec[i];
    for(let i=0;i<8;i++)ref[TARGET+i]=read1[i];
    const scoreAt=(seq,o)=>{let s=0;for(let i=0;i<8;i++)s+=ref[o+i]===seq[i]?1:-1;return s;};
    for(let pass=0;pass<3;pass++){
      for(let o=0;o<=L-8;o++){
        if(o===TARGET)continue;
        if(scoreAt(read1,o)>=5){
          for(let i=0;i<8;i++){const idx=o+i;
            if((idx<TARGET||idx>TARGET+7)&&ref[idx]===read1[i]){ref[idx]=COMP[ref[idx]];break;}}
        }
      }
    }
    // two more reads cut straight from the reference — one carries a mismatch
    const r2=ref.slice(3,11);r2[4]=COMP[r2[4]];
    const r3=ref.slice(12,20);
    const READS=[
      {seq:read1,note:"your read from module 1"},
      {seq:r2,note:"note: it carries one mismatch — a variant travels with its read"},
      {seq:r3,note:"last one"},
    ];
    const bestOf=seq=>{let b=-99;for(let o=0;o<=L-8;o++)b=Math.max(b,scoreAt(seq,o));return b;};

    coach("Drag the glowing read left and right (or use the arrows). Find the position that scores <b>+8</b>, then lock it in. Three reads to place — watch them stack.");
    const t=el("div","term");
    t.append(el("div","tlab","reference (illustrative window) · 3 reads to place"));
    const box=el("div","alnbox");box.style.paddingBottom=(READS.length*30+14)+"px";
    const refrow=el("div","brow");
    ref.forEach(b=>refrow.append(el("div","bcell refm",b)));
    box.append(refrow);
    const strips=READS.map((r,i)=>{
      const strip=el("div","readstrip");
      strip.style.top=(34+i*30)+"px";
      strip.style.display=i===0?"flex":"none";
      r.cells=r.seq.map(b=>{const c=el("div","bcell",b);strip.append(c);return c;});
      box.append(strip);
      return strip;
    });
    t.append(box);
    let act=0;const offsets=READS.map(()=>0);
    const ctrl=el("div");ctrl.style.cssText="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px";
    const leftB=el("button","btn","◀"),rightB=el("button","btn","▶");
    const score=el("span","countchip","");
    const lockB=el("button","btn primary","Lock in alignment");
    ctrl.append(leftB,rightB,score,lockB);
    t.append(ctrl);
    stage.append(t);
    stage.append(el("p","helper","Real aligners don't slide: they index the reference (BWA's FM-index, minimap2's minimizers) so short exact “seeds” jump straight to candidate spots, and only those get scored like this. Stacked reads over the same bases are your <b>coverage</b>."));

    function colorize(i){
      const r=READS[i],o=offsets[i];
      strips[i].style.left=(o*PITCH)+"px";
      let m=0;
      r.seq.forEach((b,k)=>{
        const ok=ref[o+k]===b;if(ok)m++;
        r.cells[k].classList.toggle("match",ok);
        r.cells[k].classList.toggle("mis",!ok);
      });
      return m;
    }
    function render(){
      const m=colorize(act);
      const s=2*m-8;
      score.textContent=`read ${act+1}/3 · pos ${offsets[act]}: ${m} match · ${8-m} mismatch → score ${s>=0?"+":""}${s}`;
    }
    render();
    const move=d=>{offsets[act]=Math.max(0,Math.min(L-8,offsets[act]+d));render();};
    leftB.addEventListener("click",()=>move(-1));
    rightB.addEventListener("click",()=>move(1));
    let dragS=null;
    strips.forEach((strip,i)=>{
      strip.addEventListener("pointerdown",e=>{
        if(i!==act)return;
        dragS={x:e.clientX,o:offsets[act],id:e.pointerId,strip};
        strip.setPointerCapture(e.pointerId);strip.classList.add("sliding");
      });
      strip.addEventListener("pointermove",e=>{
        if(!dragS||e.pointerId!==dragS.id||i!==act)return;
        offsets[act]=Math.max(0,Math.min(L-8,dragS.o+Math.round((e.clientX-dragS.x)/PITCH)));
        render();
      });
      const endD=e=>{if(dragS&&e.pointerId===dragS.id){dragS=null;strip.classList.remove("sliding");}};
      strip.addEventListener("pointerup",endD);strip.addEventListener("pointercancel",endD);
    });
    lockB.addEventListener("click",()=>{
      if(doneFlags[current])return;
      const r=READS[act],s=scoreAt(r.seq,offsets[act]),best=bestOf(r.seq);
      if(s===best){
        strips[act].style.cursor="default";
        if(act===0){
          coach("Locked at +8. Notice position 1 scored +4 — a paralog-like near-miss; mapping quality encodes that gap between best and second-best. Next read: "+READS[1].note+".");
          toast("Read 1 placed. MAPQ high: best hit far better than the runner-up.","good");
        }else if(act===1){
          coach("Locked — its best is +6 because of that one mismatch. The aligner keeps it and records the difference; deciding variant-vs-error comes later. One more read.");
          toast("Read 2 placed, mismatch and all.","good");
        }else{
          coach("Three reads placed, stacking over the reference — that stack is coverage, and it's exactly what the variant caller will read in two steps.",true);
          toast("All reads aligned. A pileup is born.","good");
          markDone();
          return;
        }
        act++;strips[act].style.display="flex";render();
      }else{
        toast(`Score here is ${s>=0?"+":""}${s} — this read's best possible is ${best>=0?"+":""}${best}. Keep sliding.`,"bad");
      }
    });
  }
},

/* ---------------- 13 · Indels & CIGAR ---------------- */
{
  label:"Indels & CIGAR",grp:"Alignment",dot:"B3",
  eyebrow:"Bioinformatics · Alignment",
  title:"When the read doesn't fit, open a gap",
  lede:"This read from Patient B starts perfectly, then everything mismatches. No sliding of the whole read will fix it: the patient's DNA is missing two bases the reference has — a <b>deletion</b>. Aligners handle it by splitting the alignment across a gap, recorded in the CIGAR string.",
  build(stage){
    const ref="CTGGATCATCACAG".split("");
    const read="GGATTCAC".split("");
    const OFF=2,PITCH=29,START=6,TARGET=8;
    let pos=START,solved=false;
    coach("The left half fits; the right half doesn't. <b>Grab the red half and slide it right</b> (or use the arrows) until it matches — you're stretching a gap open, and the CIGAR updates live.");
    const t=el("div","term");
    t.append(el("div","tlab","reference · read GGATTCAC (patient B) · left half anchored"));
    const refrow=el("div","brow");
    ref.forEach(b=>refrow.append(el("div","bcell refm",b)));
    t.append(refrow);
    const rowbox=el("div");rowbox.style.cssText="position:relative;height:30px;margin-top:8px";
    // anchored left half — these four already match
    const leftHalf=el("div","readstrip");leftHalf.style.left=(OFF*PITCH)+"px";leftHalf.style.top="0";leftHalf.style.cursor="default";
    read.slice(0,4).forEach(b=>leftHalf.append(el("div","bcell match",b)));
    // the gap grows here as the right half pulls away
    const gapBox=el("div","readstrip");gapBox.style.left=(6*PITCH)+"px";gapBox.style.top="0";gapBox.style.cursor="default";
    // draggable right half
    const strip=el("div","readstrip");strip.style.top="0";
    const rcells=read.slice(4).map(b=>{const c=el("div","bcell",b);strip.append(c);return c;});
    rowbox.append(leftHalf,gapBox,strip);
    t.append(rowbox);
    const ctrl=el("div");ctrl.style.cssText="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px";
    const leftB=el("button","btn","◀"),rightB=el("button","btn","▶");
    const cigar=el("span","countchip","");
    ctrl.append(leftB,rightB,cigar);
    t.append(ctrl);
    stage.append(t);
    stage.append(el("p","helper","CIGAR grammar: M = aligned (match or mismatch!), I = insertion in the read, D = deletion from the read, S = soft-clipped. 4M2D4M reads: 4 aligned, skip 2 reference bases, 4 aligned."));

    function render(){
      strip.style.left=(pos*PITCH)+"px";
      let m=4;
      rcells.forEach((c,k)=>{
        const ok=ref[pos+k]===read[4+k];if(ok)m++;
        c.classList.toggle("match",ok);c.classList.toggle("mis",!ok);
      });
      const d=pos-START;
      gapBox.innerHTML="";
      for(let g=0;g<d;g++)gapBox.append(el("div","bcell gapc","–"));
      const s=2*m-8;
      cigar.textContent=d===0?`CIGAR: 8M · score ${s>=0?"+":""}${s}`:`CIGAR: 4M${d}D4M · score ${s>=0?"+":""}${s}${solved?" − gap penalty":""}`;
      if(!solved&&pos===TARGET){
        solved=true;
        strip.style.cursor="default";leftB.disabled=rightB.disabled=true;
        cigar.textContent="CIGAR: 4M2D4M · score +8 − gap penalty";
        coach("Aligned. The read skips the two reference bases the patient doesn't have — a 2 bp deletion, spelled 4M2D4M. An indel like this can matter more than any SNV.",true);
        toast("Gapped alignment found: 4M2D4M.","good");
        markDone();
      }
    }
    render();
    const move=d=>{if(solved)return;pos=Math.max(START,Math.min(TARGET,pos+d));render();};
    leftB.addEventListener("click",()=>move(-1));
    rightB.addEventListener("click",()=>move(1));
    let dragS=null;
    strip.addEventListener("pointerdown",e=>{
      if(solved)return;
      dragS={x:e.clientX,o:pos,id:e.pointerId};
      strip.setPointerCapture(e.pointerId);strip.classList.add("sliding");
    });
    strip.addEventListener("pointermove",e=>{
      if(!dragS||e.pointerId!==dragS.id||solved)return;
      pos=Math.max(START,Math.min(TARGET,dragS.o+Math.round((e.clientX-dragS.x)/PITCH)));
      render();
    });
    const endD=e=>{if(dragS&&e.pointerId===dragS.id){dragS=null;strip.classList.remove("sliding");}};
    strip.addEventListener("pointerup",endD);strip.addEventListener("pointercancel",endD);
  }
},

{

<span class="h">#CHROM  POS       ID  REF ALT QUAL FILTER INFO         FORMAT GT:AD</span>
chr17   43106487  .   A   C   58   PASS   DP=6;AF=0.50  GT:AD  <span class="q">?/?</span>:3,3`;

      coach("Heterozygous — one chromosome carries A, the other C, so ~half the reads show each. There's your VCF record. One step left: what does it <i>mean</i>?",true);
      toast("GT=0/1. Variant called.","good");
      markDone();
    });
    hom.addEventListener("click",()=>{
      toast("If both copies carried the variant, nearly every read would show C — not half of them.","bad");
    });

    const shelf=el("div","shelf");
    shelf.append(el("div","shelf-label","Toolbox"));
    shelf.append(makeChip({label:"Variant flag",sub:"candidate site",glyph:GL.flag("var(--T)"),payload:"varflag"}));
    stage.append(shelf);
  }
},

/* ---------------- 16 · Interpretation ---------------- */
{
  label:"Interpretation",grp:"Variants",dot:"B6",
  eyebrow:"Bioinformatics · Interpretation",
  title:"From coordinate to consequence",
  lede:"Annotation places your VCF row in the genome: it lands in <b>BRCA1</b> — a real, well-documented variant, <b>c.181T>G (p.Cys61Gly)</b>. Software can name it; deciding what it <i>means</i> takes evidence. Query the world's databases, then make the call.",
  build(stage){
    coach("First, gather evidence: press <b>Query</b> on each of the four databases.");
    const t=el("div","term");
    t.append(el("div","tlab","annotation · BRCA1 · GRCh38"));
    const anno=el("div","fastq");anno.style.cssText="background:none;border:none;padding:0;margin:0";
    anno.innerHTML=`<span class="h">genomic   </span>chr17:43,106,487 A>C
<span class="h">gene      </span>BRCA1 <span class="h">(read from the minus strand — so on the coding strand this is T>G)</span>
<span class="h">cDNA      </span>c.181T>G
<span class="h">codon 61  </span>TGT (Cys) → GGT (Gly) — <span class="q">missense</span>, in the RING domain
<span class="h">protein   </span>p.(Cys61Gly)`;
    t.append(anno);
    stage.append(t);

    const ev=el("div","term evres");ev.style.marginTop="14px";
    ev.append(el("div","tlab","evidence"));
    const DB={
      clinvar:{name:"ClinVar",res:"<b>Pathogenic</b> — reviewed by expert panel (ENIGMA), dozens of submitters agree"},
      gnomad:{name:"gnomAD",res:"exome AF ≈ <b>0.0017%</b> (25 / 1,452,604 alleles, v4.1) · genome AF 0.0033% — very rare in the population"},
      pred:{name:"Predictors",res:"SIFT 0.00 (<b>damaging</b>) · PolyPhen-2 0.999 (<b>probably damaging</b>) · ClinPred 0.98 (<b>pathogenic</b>) · AlphaMissense: <b>pathogenic</b>"},
      cosmic:{name:"COSMIC",res:"found in <b>4 tumours</b> (breast ×2, ovary, urinary tract) — 0.17% of BRCA1-mutant tumours"},
    };
    const evRows={};let queried=0;
    Object.entries(DB).forEach(([k,d])=>{
      const rr=el("div","rrow");rr.style.cssText="display:flex;gap:12px;padding:7px 0;border-bottom:1px dashed #26364F;align-items:center";
      rr.append(el("span","rk",d.name));
      const rv=el("span","","<span style='color:#71829C'>— not queried —</span>");rv.style.cssText="font-size:13.5px;flex:1";
      const qb=el("button","qbtn","Query");
      qb.addEventListener("click",()=>{
        qb.disabled=true;
        evRows[k].innerHTML=DB[k].res;
        queried++;
        if(queried===4){
          coach("The evidence is concordant. Now the human step: drag your <b>classification</b> onto the report — Benign, VUS, or Pathogenic?");
          toast("All four sources answered.","good");
        }else{
          toast(DB[k].name+" answered.","good");
        }
      });
      rr.append(rv,qb);evRows[k]=rv;ev.append(rr);
    });
    stage.append(ev);
    stage.append(el("p","helper","Values summarized from real ClinVar, gnomAD v4.1, COSMIC and predictor annotations for this variant, simplified to one transcript for teaching — for clinical work, always consult the live records."));

    const report=el("div","report");report.style.marginTop="18px";
    const rows={};
    [["gene","BRCA1"],["variant","chr17:43,106,487 A>C · c.181T>G"],["protein","p.(Cys61Gly) — missense, RING domain"],["classification",null],["next step","—"]].forEach(([k,v])=>{
      const rr=el("div","rrow");
      rr.append(el("span","rk",k));
      let rv;
      if(k==="classification")rv=el("span","slotbox","gather the evidence, then drop your verdict here");
      else rv=el("span","rv"+(v==="—"?" pend":""),v);
      rr.append(rv);rows[k]=rv;report.append(rr);
    });
    stage.append(report);

    registerZone(rows["classification"],p=>{
      if(!p.startsWith("verdict:"))return false;
      if(queried<4)return "Classify only on full evidence — query all four sources first.";
      const v=p.split(":")[1];
      if(v==="benign")return "An allele frequency of 0.0017% is far too rare for a benign polymorphism — and ClinVar's expert panel plus every predictor point the other way.";
      if(v==="vus")return "VUS is for thin or conflicting evidence. Here the lines agree: an expert-panel ClinVar assertion, rarity in gnomAD, and damaging predictions.";
      rows["classification"].textContent="Pathogenic";rows["classification"].className="rv";
      rows["classification"].style.color="var(--T)";
      rows["next step"].textContent="confirmatory testing · genetic counseling · family cascade screening";
      rows["next step"].classList.remove("pend");
      coach("Pathogenic — the same call ClinVar's expert panel made. Notice what got you here: not one score, but concordant evidence. That judgment is the part software doesn't do for you.",true);
      toast("Classification complete: BRCA1 c.181T>G — Pathogenic.","good");
      markDone();
      return true;
    });

    const shelf=el("div","shelf");
    shelf.append(el("div","shelf-label","Verdict cards"));
    shelf.append(
      makeChip({label:"Benign",sub:"no clinical concern",glyph:GL.flag("var(--A)"),payload:"verdict:benign"}),
      makeChip({label:"VUS",sub:"uncertain significance",glyph:GL.flag("#8494A9"),payload:"verdict:vus"}),
      makeChip({label:"Pathogenic",sub:"disease-causing",glyph:GL.flag("var(--T)"),payload:"verdict:path"}),
    );
    stage.append(shelf);
  }
},

/* ---------------- 17 · Grand finale ---------------- */
{
  label:"Pipeline complete",grp:"Finish",dot:"✓",eyebrow:"Run summary",
  title:"Sample to variant, end to end",
  lede:"You lysed the cells, built and enriched the library, ran the sequencer — and then QC'd, aligned, deduplicated, called and annotated the result. That's the whole modern sequencing pipeline, wet and dry.",
  autoDone:true,
  build(stage){
    coach("Both modules complete. Press <b>Run it again</b> to start from the first pipette.",true);
    const items=[
      ["Module 1","cells → clean DNA → sized, barcoded, enriched library → clusters → <b>FASTQ</b>"],
      ["QC & trimming","cut the low-quality tail and the adapter read-through"],
      ["Alignment","slid three reads to their best-scoring homes (+1/−1) and watched a pileup form"],
      ["CIGAR","stretched open a 2 bp gap: <b>4M2D4M</b> — a deletion, recorded honestly"],
      ["Sort & dedup","coordinate-sorted the BAM and flagged the PCR clones"],
      ["Variant calling","3 of 6 clean reads → chr17:43,106,487 A>C, genotype <b>0/1</b>"],
      ["Interpretation","BRCA1 c.181T>G · p.(Cys61Gly): ClinVar + gnomAD + predictors → <b>Pathogenic</b>"],
    ];
    const ul=el("ul","recap");
    items.forEach(([k,v])=>{
      const li=el("li");li.append(el("span","k",k),el("span","v",v));ul.append(li);
    });
    stage.append(ul);
    stage.append(el("p","helper","Where next, if you're curious: paired-end reads, base-quality recalibration (BQSR), joint calling across samples, structural variants, UMIs, RNA-seq, and long-read platforms that skip fragmentation entirely."));
  }
},
];

/* ============================ boot ============================ */
loadProg();
renderRail();
go(0);
</script>
